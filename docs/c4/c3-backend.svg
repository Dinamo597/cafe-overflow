<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-label="Diagrama de componentes del backend: Presentation envía HTTP/JSON al API Handler, que llama a CatalogoService, ClienteService y PedidoService; PedidoService usa DescuentoService y FidelidadService y, junto con los otros servicios, depende de las interfaces ProductoDAO, ClienteDAO y PedidoDAO; las implementaciones SQLite de esos DAOs ejecutan SQL contra la base de datos SQLite.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #1b2430; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .muted { fill: #5b6472; }
  </style>
  <rect x="0" y="0" width="1400" height="820" fill="#f3f5f8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="100" width="1320" height="580" rx="14" fill="none" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="3 6"/>
    <text x="58" y="122" font-size="12.5" class="mono muted" letter-spacing="0.04em">BACKEND — api + negocio + persistencia (un solo proceso Python)</text>

    <g transform="translate(1058,112)" font-size="11.5" class="muted">
      <line x1="0" y1="4" x2="26" y2="4" stroke="#1b2430" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="32" y="8">usa / llama</text>
      <line x1="0" y1="22" x2="26" y2="22" stroke="#1b2430" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="32" y="26">implementa</text>
    </g>

    <rect x="570" y="20" width="260" height="50" rx="8" fill="#e9ebee" stroke="#5b6472" stroke-width="1.5"/>
    <text x="700" y="41" text-anchor="middle" font-size="13.5" font-weight="600">Presentation (Node)</text>
    <text x="700" y="58" text-anchor="middle" font-size="11" class="muted">otro contenedor — fuera del backend</text>

    <rect x="490" y="140" width="420" height="56" rx="8" fill="#dce8f6" stroke="#35628f" stroke-width="1.6"/>
    <text x="700" y="163" text-anchor="middle" font-size="14" font-weight="600">API Handler</text>
    <text x="700" y="180" text-anchor="middle" font-size="11" class="muted">api/ · JSON ↔ servicios, excepciones → 400/409</text>

    <rect x="200" y="240" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6"/>
    <text x="320" y="263" text-anchor="middle" font-size="13.5" font-weight="600">CatalogoService</text>
    <text x="320" y="280" text-anchor="middle" font-size="10.5" class="mono muted">listar_menu()</text>

    <rect x="480" y="240" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6"/>
    <text x="600" y="263" text-anchor="middle" font-size="13.5" font-weight="600">ClienteService</text>
    <text x="600" y="280" text-anchor="middle" font-size="10.5" class="mono muted">crear_cliente()</text>

    <rect x="760" y="240" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6"/>
    <text x="880" y="263" text-anchor="middle" font-size="13.5" font-weight="600">PedidoService</text>
    <text x="880" y="280" text-anchor="middle" font-size="10.5" class="mono muted">cotizar · crear · pagar · avanzar</text>

    <rect x="1080" y="240" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6"/>
    <text x="1200" y="263" text-anchor="middle" font-size="13.5" font-weight="600">DescuentoService</text>
    <text x="1200" y="280" text-anchor="middle" font-size="10.5" class="muted">5 / 10 / 15% por nivel</text>

    <rect x="1080" y="320" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6"/>
    <text x="1200" y="343" text-anchor="middle" font-size="13.5" font-weight="600">FidelidadService</text>
    <text x="1200" y="360" text-anchor="middle" font-size="10.5" class="muted">ascenso de nivel · DevPoints</text>

    <rect x="200" y="450" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="320" y="470" text-anchor="middle" font-size="10.5" font-style="italic" class="muted">«interface»</text>
    <text x="320" y="486" text-anchor="middle" font-size="13" font-weight="600">ProductoDAO</text>

    <rect x="480" y="450" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="600" y="470" text-anchor="middle" font-size="10.5" font-style="italic" class="muted">«interface»</text>
    <text x="600" y="486" text-anchor="middle" font-size="13" font-weight="600">ClienteDAO</text>

    <rect x="760" y="450" width="240" height="56" rx="8" fill="#dcefe1" stroke="#2f7a52" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="880" y="470" text-anchor="middle" font-size="10.5" font-style="italic" class="muted">«interface»</text>
    <text x="880" y="486" text-anchor="middle" font-size="13" font-weight="600">PedidoDAO</text>

    <rect x="200" y="560" width="240" height="56" rx="8" fill="#ece2f7" stroke="#6b4b9e" stroke-width="1.6"/>
    <text x="320" y="583" text-anchor="middle" font-size="13" font-weight="600">ProductoDAOSQLite</text>
    <text x="320" y="600" text-anchor="middle" font-size="10.5" class="muted">persistencia/</text>

    <rect x="480" y="560" width="240" height="56" rx="8" fill="#ece2f7" stroke="#6b4b9e" stroke-width="1.6"/>
    <text x="600" y="583" text-anchor="middle" font-size="13" font-weight="600">ClienteDAOSQLite</text>
    <text x="600" y="600" text-anchor="middle" font-size="10.5" class="muted">persistencia/</text>

    <rect x="760" y="560" width="240" height="56" rx="8" fill="#ece2f7" stroke="#6b4b9e" stroke-width="1.6"/>
    <text x="880" y="583" text-anchor="middle" font-size="13" font-weight="600">PedidoDAOSQLite</text>
    <text x="880" y="600" text-anchor="middle" font-size="10.5" class="muted">persistencia/</text>

    <rect x="550" y="740" width="300" height="60" rx="10" fill="#e9ebee" stroke="#5b6472" stroke-width="1.6"/>
    <text x="700" y="764" text-anchor="middle" font-size="13.5" font-weight="600">SQLite</text>
    <text x="700" y="781" text-anchor="middle" font-size="11" class="mono muted">cafe_overflow.db</text>

    <g stroke="#1b2430" fill="none">
      <line x1="700" y1="70" x2="700" y2="138" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="712" y="92" fill="#1b2430" font-size="11" stroke="none">HTTP/JSON</text>

      <line x1="560" y1="196" x2="340" y2="238" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="402" y="212" fill="#1b2430" font-size="10.5" stroke="none" text-anchor="middle">listar_menu()</text>

      <line x1="660" y1="196" x2="615" y2="238" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="665" y="216" fill="#1b2430" font-size="10.5" stroke="none" text-anchor="middle">crear_cliente()</text>

      <line x1="840" y1="196" x2="875" y2="238" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="960" y="216" fill="#1b2430" font-size="10.5" stroke="none" text-anchor="middle">cotizar / pedido / pago / estado</text>

      <line x1="1000" y1="260" x2="1078" y2="262" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="1039" y="252" fill="#1b2430" font-size="10.5" stroke="none" text-anchor="middle">calcular_descuento()</text>

      <line x1="1000" y1="285" x2="1078" y2="335" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="1050" y="318" fill="#1b2430" font-size="10.5" stroke="none" text-anchor="middle">ascenso + DevPoints</text>

      <line x1="320" y1="296" x2="320" y2="448" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="600" y1="296" x2="600" y2="448" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="880" y1="296" x2="880" y2="448" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="815" y1="296" x2="400" y2="448" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>
      <line x1="845" y1="296" x2="660" y2="448" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

      <line x1="320" y1="560" x2="320" y2="508" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="600" y1="560" x2="600" y2="508" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="880" y1="560" x2="880" y2="508" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <line x1="340" y1="616" x2="605" y2="738" stroke-width="1.3" marker-end="url(#arrow)" opacity="0.85"/>
      <line x1="600" y1="616" x2="650" y2="738" stroke-width="1.3" marker-end="url(#arrow)"/>
      <line x1="860" y1="616" x2="760" y2="738" stroke-width="1.3" marker-end="url(#arrow)" opacity="0.85"/>
      <text x="660" y="690" fill="#1b2430" font-size="11" stroke="none" text-anchor="middle">SQL</text>
    </g>
  </g>
</svg>
